<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Portal | Farm To Home</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/language.css">
</head>
<body class="auth-page">
  <header class="navbar">
    <a href="index.html" class="logo">Farm<span>To Home</span></a>
    <div class="nav-actions">
      <select id="languageSelect" aria-label="Choose language">
        <option value="en">English</option>
        <option value="mr">मराठी</option>
        <option value="hi">हिन्दी</option>
      </select>
      <a href="index.html" class="nav-link" data-i18n="home">Home</a>
    </div>
  </header>

  <main class="auth-wrapper seller-wrapper">
    <section class="auth-card">
      <div class="auth-icon">F</div>
      <h1 data-i18n="sellerWelcome">Farmer / Seller Portal</h1>
      <p class="auth-subtitle" data-i18n="sellerSubtitle">
        Sell your farm products directly to customers.
      </p>

      <div class="tab-buttons">
        <button type="button" class="tab-button active" id="loginTab"
                data-i18n="login">Login</button>
        <button type="button" class="tab-button" id="registerTab"
                data-i18n="register">Register</button>
      </div>

      <form id="sellerLoginForm">
        <label for="sellerLoginEmail" data-i18n="email">Email</label>
        <input id="sellerLoginEmail" type="email" required autocomplete="username">

        <label for="sellerLoginPassword" data-i18n="password">Password</label>
        <input id="sellerLoginPassword" type="password" required
               autocomplete="current-password">

        <button class="btn btn-primary full-width" type="submit"
                data-i18n="sellerLoginButton">Login as Seller</button>
        <p id="sellerLoginMessage" class="form-message" aria-live="polite"></p>
      </form>

      <form id="sellerRegisterForm" class="hidden">
        <label for="sellerName" data-i18n="sellerName">Farmer / Business Name</label>
        <input id="sellerName" type="text" required>

        <label for="sellerRegisterEmail" data-i18n="email">Email</label>
        <input id="sellerRegisterEmail" type="email" required autocomplete="email">

        <label for="sellerPhone" data-i18n="phone">Phone Number</label>
        <input id="sellerPhone" type="tel" required pattern="[0-9]{10}"
               maxlength="10">

        <label for="sellerLocation" data-i18n="location">Village / City</label>
        <input id="sellerLocation" type="text" required>

        <label for="sellerRegisterPassword" data-i18n="password">Password</label>
        <input id="sellerRegisterPassword" type="password" required minlength="6"
               autocomplete="new-password">

        <button class="btn btn-primary full-width" type="submit"
                data-i18n="sellerRegisterButton">Register as Seller</button>
        <p id="sellerRegisterMessage" class="form-message" aria-live="polite"></p>
      </form>

      <p class="auth-note" data-i18n="demoWarning">
        Prototype only. Do not use real passwords.
      </p>
    </section>

    <section id="sellerDashboard" class="dashboard-card hidden">
      <div class="dashboard-heading">
        <div>
          <p class="eyebrow" data-i18n="sellerDashboardLabel">SELLER DASHBOARD</p>
          <h2><span data-i18n="welcome">Welcome</span>, <span id="sellerDisplayName"></span></h2>
          <p data-i18n="manageProducts">Add and manage your products.</p>
        </div>
        <button id="sellerLogout" class="btn btn-outline" data-i18n="logout">Logout</button>
      </div>

      <form id="addProductForm" class="product-form">
        <h3 data-i18n="addProduct">Add a Product</h3>

        <label for="productName" data-i18n="productName">Product Name</label>
        <input id="productName" type="text" required maxlength="80">

        <label for="productCategory" data-i18n="category">Category</label>
        <select id="productCategory" required>
          <option value="Vegetables">Vegetables</option>
          <option value="Fruits">Fruits</option>
          <option value="Grains">Grains</option>
          <option value="Dairy">Dairy</option>
          <option value="Other">Other</option>
        </select>

        <div class="form-row">
          <div>
            <label for="productPrice" data-i18n="price">Price (₹)</label>
            <input id="productPrice" type="number" min="1" step="0.01" required>
          </div>
          <div>
            <label for="productUnit" data-i18n="unit">Unit</label>
            <select id="productUnit">
              <option value="kg">kg</option>
              <option value="500 g">500 g</option>
              <option value="dozen">dozen</option>
              <option value="litre">litre</option>
              <option value="piece">piece</option>
            </select>
          </div>
        </div>

        <label for="productQuantity" data-i18n="quantity">Available Quantity</label>
        <input id="productQuantity" type="number" min="1" step="1" required>

        <label for="productImage" data-i18n="imageUrl">Product Image URL (optional)</label>
        <input id="productImage" type="url" placeholder="https://example.com/image.jpg">

        <button class="btn btn-primary full-width" type="submit"
                data-i18n="publishProduct">Publish Product</button>
        <p id="addProductMessage" class="form-message" aria-live="polite"></p>
      </form>

      <h3 data-i18n="myProducts">My Products</h3>
      <div id="sellerProducts" class="seller-products"></div>
    </section>
  </main>

  <script src="js/language.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
